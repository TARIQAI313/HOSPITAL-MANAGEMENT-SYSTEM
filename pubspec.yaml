name: hospital_management
description: "AuraCare - Enterprise Hospital Management & Patient Care Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture & State Management
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Supabase Backend & Database
  supabase_flutter: ^2.5.6

  # Networking & Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.2.3

  # UI & Presentation
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
