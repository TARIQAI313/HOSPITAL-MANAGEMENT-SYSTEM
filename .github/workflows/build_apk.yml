name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose > build.log 2>&1 || true
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "Build failed. Pushing build.log to error-log branch..."
            git config user.name "Cloud Builder"
            git config user.email "builder@github.actions"
            git checkout -b error-log
            git add -f build.log
            git commit -m "chore: save build error log"
            git push -f origin error-log || true
            exit 1
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AuraCare-Hospital-Management-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "AuraCare HMS - Android APK v1.0.0"
          body: "Official Android APK for AuraCare Hospital Management & Patient Care Application."
          files: build/app/outputs/flutter-apk/app-release.apk
        continue-on-error: true
